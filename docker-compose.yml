# Local deployment of the serving image.
#
#   docker compose up --build              one replica on :8000
#   docker compose up --build --scale api=3   three, behind the nginx below
#
# Scaling out rather than up is the right axis here and not an assumption: a
# prediction is CPU-bound Python that holds the GIL throughout, so one process
# saturates one core no matter how many threads waitress is given. Measured on
# the development laptop, a single replica peaked at 71 requests/s and stayed
# there from concurrency 1 to 16; three replicas reached 138. Sublinear
# because the host was a busy 8-core laptop also running the load generator,
# not because the replicas contend: they share nothing. Each loads its own
# copy of the model and holds no writable state.

services:
  api:
    build: .
    image: f1-tyre-degradation
    # No host port when scaled: docker assigns one per replica and nginx
    # fronts them. Publish 8000:8000 explicitly for a single replica.
    expose:
      - "8000"
    environment:
      # Threads per replica. Beyond a couple this adds queueing rather than
      # throughput, for the GIL reason above; the sweep is in docs/FINDINGS.md.
      F1_SERVICE_THREADS: "4"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    # The container writes nothing after start-up: the model is read once and
    # every request is pure computation. tmpfs covers Python's temp needs.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
