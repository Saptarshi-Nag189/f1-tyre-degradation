# Round-robins across the api replicas that docker compose creates.
#
# "api" resolves through docker's embedded DNS at 127.0.0.11 to every
# replica's address. The address is held in a variable rather than written
# into proxy_pass directly, which is what forces nginx to resolve per request
# instead of once at start-up. Without that, a stack scaled after nginx
# started keeps hitting whichever replica existed first, and the scaling
# measurement quietly becomes a single-replica measurement.
#
# The alternative, "server api:8000 resolve" inside an upstream block, is an
# nginx Plus directive and is silently useless on the open-source build.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health of the proxy itself, distinct from the health of the pool behind
    # it. Answering here without touching a replica is deliberate.
    location = /lb-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
