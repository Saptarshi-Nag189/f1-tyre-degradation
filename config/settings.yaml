# Global configuration. All magic numbers live here.
# Sources cited inline; see docs/compass_technical_document.md.

project:
  seasons: [2022, 2023, 2024]
  session_type: "R"          # race sessions only
  british_english: true

collection:
  # Measured by scripts/probe_api_cost.py on 2023 round 4:
  #   11 requests per race with laps+weather only, +2 with telemetry,
  #   0 on a repeat load (the cache fully bypasses the rate limiter).
  # 46 races x 11 = 506 requests, marginally over the 500/hour limit, so
  # collection runs one season per batch. 2022 is added last as a pure
  # addition once the pipeline is proven end to end.
  requests_per_session: 11
  batch_order: [2023, 2024, 2022]
  budget_per_hour: 500
  budget_soft_limit: 450     # start sleeping here, leaving headroom
  min_request_interval_s: 0.25

paths:
  fastf1_cache: "./cache/fastf1"    # deliberately outside data/ so that
                                    # clearing data/ cannot destroy it
  raw_laps: "./data/raw/laps"
  raw_telemetry: "./data/raw/telemetry"
  processed: "./data/processed"
  models: "./artifacts/models"
  reports: "./artifacts/reports"
  logs: "./logs"

fuel_correction:
  # F1Briefing: "each additional kilogram adding about 0.03 seconds per lap".
  # Agreed value 0.032 s/kg sits inside the practitioner band 0.025-0.040.
  penalty_s_per_kg: 0.032
  initial_fuel_kg: 110.0      # FIA max fuel load
  # Fuel burned on lap N = (N-1) * burn_per_lap (car runs lap N on start-of-lap fuel).
  # burn_per_lap derived at runtime: initial_fuel_kg / scheduled_race_laps.

car:
  # FIA 2022 Technical Regulations Art. 4.1: minimum mass without fuel 798 kg.
  min_mass_kg: 798.0
  wheel_diameter_in: 18       # 18-inch wheels from 2022

physics:
  # Savitzky-Golay derivative estimation (Savitzky & Golay 1964).
  savgol_polyorder: 2
  savgol_windows: [7, 11, 15, 21]   # tested empirically; odd lengths required
  gravity_ms2: 9.80665
  # fastf1 reports position X, Y, Z in 1/10 m (fastf1/core.py:60-62), NOT
  # metres. Curvature scales as 1/L, so raw coordinates give lateral
  # acceleration 10x too low. Divide by this before differentiating.
  position_units_per_metre: 10.0

strategy:
  pit_loss_s: 25.0            # typical pit-lane time loss 20-25 s
  # A pit window is the range of stop laps that costs no more than this much
  # against the optimum. It is also the pruning threshold in the strategy
  # search: candidates slower than best + this are discarded unless they are
  # the first example of their compound sequence. The two must be the same
  # number, or the window would be clipped by the search rather than by the
  # criterion, so it is defined once here.
  pit_window_slack_s: 1.0

clean_lap:
  stint_median_multiplier: 1.07   # exclude laps > 107% of stint median
  track_status_ok: "1"            # TrackStatus == '1' means green/all-clear

target:
  # CWI validation decision rule (Spearman energy vs degradation slope)
  spearman_keep_threshold: 0.4    # energy stays, weight 0.5
  spearman_downweight_low: 0.2    # 0.2-0.4 -> laptime weight 0.7
  energy_weight_full: 0.5
  laptime_weight_downweight: 0.7
  # Stint acceptance is by the PRECISION of the slope estimate, not by the
  # strength of the correlation.
  #
  # The compass design filters on |r| >= 0.3. Measured against the collected
  # data, that is a slope-magnitude filter wearing a fit-quality costume:
  #   corr(|r|, |slope|) = +0.53   but   corr(|r|, stderr) = -0.20
  # and its pass rate runs from 29.5% for near-zero slopes to 98.7% for large
  # ones. A genuinely flat stint has low correlation by construction, however
  # well it is measured.
  #
  # The damage is concentrated exactly where it matters most for strategy.
  # Monaco stints are measured MORE precisely than average (median slope
  # stderr 0.0062 against 0.0152 elsewhere) yet were being discarded for
  # being flat, which is the one thing everyone already knows about Monaco.
  #
  # A standard error of 0.02 s/lap is small against a typical degradation of
  # ~0.065 s/lap, so surviving stints have their rate pinned well enough to
  # separate a high-degradation circuit from a low one. That is the purpose
  # the threshold serves, stated independently of what it does to any metric.
  max_slope_stderr: 0.02          # s/lap; precision of the fitted slope
  linregress_min_r: 0.0           # retained for the config contract; the
                                  # precision criterion supersedes it
  min_stint_laps: 5               # need enough clean laps to fit a slope

  # Physical plausibility bounds on the fitted slope. A stint whose corrected
  # lap time falls substantially with tyre age is measuring track evolution
  # (rubbering in, a drying line) rather than tyre recovery, which does not
  # happen. Retaining such stints labels a track-condition effect as degradation.
  #
  # The lower bound is NOT zero. A circuit with genuinely no measurable
  # degradation produces small slopes scattered either side of zero, and
  # truncating at zero would keep only the positive half of that noise and
  # bias the estimate upward - precisely at the circuits where a strategist
  # most needs to know that degradation is negligible. Monaco's true median
  # slope is -0.008 s/lap, so a zero bound deleted it entirely.
  #
  # -0.05 s/lap is about one second of improvement across a 20-lap stint,
  # which track evolution can plausibly produce; beyond that it is not tyre
  # behaviour at all. The observed extreme was -1.07 s/lap.
  #
  # Measured effect of the bounds: cross-season per-circuit correlation rises
  # from 0.18 to 0.43. The contamination was masking transferable signal
  # rather than merely adding noise. Any filter touching the target risks a
  # selection effect, so both bounds log their counts and Gate 2 reports the
  # resulting retention.
  min_plausible_deg_rate: -0.05   # s/lap; below this is track evolution
  max_plausible_deg_rate: 0.3     # s/lap; beyond this is a data artefact

modelling:
  optuna_trials: 50
  ts_splits: 4
  train_seasons: [2022, 2023]
  holdout_season: 2024
  baseline_gate_pct: 15.0         # XGBoost must beat baseline MAE by >=15%
  tier_gate_pct: 3.0              # each feature tier kept if CV MAE improves >=3%
  ensemble_gate_pct: 5.0          # LSTM ensemble kept if MAE improves >=5%
  ljung_box_alpha: 0.05           # residual autocorrelation gate
  random_state: 42
